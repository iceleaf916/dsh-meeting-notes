name: Release

# 打 tag（v*）即发布；也可以在 Actions 页面手动指定一个已存在的 tag 重跑。
#
# 认证：npm 可信发布（OIDC），仓库不存任何密钥。
#   包设置里已登记 type=github / repo=iceleaf916/dsh-meeting-notes / file=release.yml
#   （`npm trust list @iceleaf/dsh-meeting-notes` 可核对），CI 用 id-token: write
#   换一次性发布凭据并签名 provenance。可信发布要求包已存在，所以首次发布是在
#   真实终端里人工跑 ./publish.sh 完成的；此后一律走本工作流。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（如 v0.2.1），必须与 package.json 的 version 一致"
        required: true

permissions:
  contents: read
  id-token: write # OIDC：可信发布 + provenance 签名

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 手动触发时检出的必须是输入的那个 tag，否则校验的版本号可能不是要发布的那个
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 校验 tag、版本号与分支
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag=$TAG 与 package.json 的 v$VERSION 不一致：先改版本号并提交，再打 tag"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::该 tag 指向的提交不在 origin/main 上，拒绝发布"
            exit 1
          fi
          echo "准备发布 $TAG"

      - name: 安装依赖
        run: npm ci --omit=optional

      - name: 测试
        run: |
          set -euo pipefail
          node test/smoke.mjs
          node test/models.mjs
          node test/qwen3.mjs

      - name: 发布到 npm（可信发布 / OIDC）
        run: ./publish.sh --ci --provenance --skip-tests
